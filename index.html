  }
  header { padding:16px 20px; background:var(--olive-dark); color:var(--sand); display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .header-left { display:flex; align-items:center; gap:14px; }
  header img { height:44px; width:auto; display:block; }
  header h1 { font-family:'Fraunces',serif; font-size:22px; margin:0; }
  .admin-area { font-size:13px; }
  .admin-btn { width:auto; padding:7px 14px; font-size:13px; background:rgba(255,255,255,.15); }
  .admin-badge { background:rgba(255,255,255,.15); padding:6px 12px; border-radius:999px; display:flex; align-items:center; gap:8px; }
  .admin-badge button { width:auto; padding:0; background:none; color:var(--sand); text-decoration:underline; font-size:12px; }
  .update-banner { background:var(--olive); color:var(--white); text-align:center; padding:10px; font-size:14px; cursor:pointer; display:none; }
  main { max-width:600px; margin:0 auto; padding:20px 16px 60px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tab { padding:8px 16px; border-radius:999px; border:1px solid var(--sand-deep); background:var(--white); cursor:pointer; font-size:14px; color:#000; }
  .tab.active { background:var(--olive); color:#000; border-color:var(--olive); font-weight:600; }
  .card { background:var(--white); border-radius:14px; padding:18px; border:1px solid var(--sand-deep); margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-size:12px; opacity:.6; padding:6px 4px; border-bottom:1px solid var(--sand-deep); }
  td { padding:8px 4px; border-bottom:1px solid var(--sand-deep); }
  .status.open { color:var(--open); } .status.paid { color:var(--paid); }
  label { font-size:12px; opacity:.65; display:block; margin-bottom:4px; }
  input, select { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--sand-deep); background:var(--sand); margin-bottom:10px; font-size:15px; }
  button { width:100%; padding:11px; border:none; border-radius:9px; background:var(--olive-dark); color:var(--white); font-size:15px; cursor:pointer; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--sand); padding:10px 16px; border-radius:8px; opacity:0; transition:.3s; }
  .toast.show { opacity:1; }
  .del-btn { background:none; border:none; color:var(--open); font-size:16px; cursor:pointer; padding:0 4px; width:auto; }
</style>

<div class="update-banner" id="updateBanner" onclick="dismissBanner()"></div>
<main>
  <div class="tabs" id="tabs"></div>
  <div class="card">
    <table id="table"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
  </div>
  <div class="card">
    <h3 style="font-family:'Fraunces',serif;">Neuer Eintrag</h3>
    <label>Datum</label>
    <input type="date" id="fDatum">
    <label id="lAnzahl">Anzahl Frühstück</label>
    <input type="text" id="fAnzahl" placeholder="z. B. 2 oder 4 (Sein Sohn+1)">
    <div id="statusField">
      <label>Status</label>
      <select id="fStatus"><option value="open">offen</option><option value="paid">bezahlt</option></select>
    </div>
    <div id="mitarbeiterField">
      <label>Mitarbeiter</label>
      <select id="fMitarbeiter">
        <option value="Bestami">Bestami</option>
        <option value="Mereyem">Mereyem</option>
        <option value="Alagie">Alagie</option>
        <option value="Uday">Uday</option>
        <option value="Ramaz">Ramaz</option>
      </select>
    </div>
    <button onclick="saveEntry()" id="saveBtn">Speichern</button>
    <button onclick="cancelEdit()" id="cancelBtn" style="display:none; background:var(--sand-deep); color:var(--ink); margin-top:8px;">Bearbeiten abbrechen</button>
  </div>
  <div class="card">
    <button onclick="downloadAll()" style="background:var(--sand-deep); color:var(--ink);">Alle Daten als PDF herunterladen</button>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXG98tsWakEJd73afakHbSa5fJbGz5IP9dX8vj0PrDnyDoWxfA_k5zljccSyGAk81TpA/exec";
  var allData = {};
  var groups = [];
  var active = null;
  var editingRow = null;
  var isAdmin = false;
  var adminCode = null;
  var lastData = null;
  var SIMPLE_GROUPS = ['Seminarraum', 'Seminar Raum', 'Seminar raum']; // Gruppen mit nur Datum + Anzahl

  function isSimple(g) { return SIMPLE_GROUPS.map(function(s){return s.toLowerCase();}).indexOf((g||'').toLowerCase()) !== -1; }

  function apiGet(action) {
    return fetch(APPS_SCRIPT_URL + '?api=' + encodeURIComponent(action))
      .then(function(r) { return r.json(); });
  }

  function apiPost(action, payload) {
    payload = payload || {};
    payload.action = action;
    return fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function(r) { return r.json(); });
  }

  function renderAdminArea() {
    var el = document.getElementById('adminArea');
    if (isAdmin) {
      el.innerHTML = '<div class="admin-badge">Managerin angemeldet <button onclick="adminLogout()">Abmelden</button></div>';
    } else {
      el.innerHTML = '<button class="admin-btn" onclick="adminLogin()">Admin-Login</button>';
    }
  }

  function adminLogin() {
    var code = prompt('Admin-Code eingeben:');
    if (code === null) return;
    apiPost('verifyAdminCode', { code: code }).then(function(res) {
      if (res.ok && res.data) {
        isAdmin = true;
        adminCode = code;
        renderAdminArea();
        toast('Als Managerin angemeldet.');
      } else {
        toast('Falscher Admin-Code.');
      }
    }).catch(function(err) { toast('Fehler: ' + err.message); });
  }

  function adminLogout() {
    isAdmin = false;
    adminCode = null;
    renderAdminArea();
    toast('Abgemeldet.');
  }

  function askCode() {
    if (isAdmin) return adminCode;
    return prompt('Admin-Code eingeben:');
  }

  function showUpdateBanner(msg) {
    var b = document.getElementById('updateBanner');
    b.textContent = msg + ' (zum Ausblenden tippen)';
    b.style.display = 'block';
  }

  function dismissBanner() {
    document.getElementById('updateBanner').style.display = 'none';
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2500);
  }

  function load(isPoll) {
    apiGet('data').then(function(res) {
      if (!res.ok) { toast('Fehler beim Laden: ' + res.error); return; }
      var data = res.data;
      if (isPoll && lastData) {
        Object.keys(data).forEach(function(g) {
          var prevRows = {};
          (lastData[g] || []).forEach(function(e) { prevRows[e.row] = true; });
          (data[g] || []).forEach(function(e) {
            if (!prevRows[e.row]) {
              showUpdateBanner('Neuer Eintrag – ' + g + ': ' + e.datum + (e.anzahl ? ' (' + e.anzahl + ')' : '') + (e.erstelltAm ? ' · erstellt am ' + e.erstelltAm : ''));
            }
          });
        });
      }
      lastData = data;

      allData = data;
      groups = Object.keys(data);
      active = active || groups[0];
      renderTabs();
      renderForm();
      renderTable();
    }).catch(function(err) { toast('Fehler beim Laden: ' + err.message); });
  }

  function renderTabs() {
    var el = document.getElementById('tabs');
    el.innerHTML = '';
    groups.forEach(function(g) {
      var b = document.createElement('button');
      b.className = 'tab' + (g === active ? ' active' : '');
      b.textContent = g;
      b.onclick = function() { active = g; cancelEdit(); renderTabs(); renderForm(); renderTable(); };
      el.appendChild(b);
    });
  }

  function renderForm() {
    var simple = isSimple(active);
    document.getElementById('statusField').style.display = simple ? 'none' : 'block';
    document.getElementById('mitarbeiterField').style.display = simple ? 'none' : 'block';
    document.getElementById('lAnzahl').textContent = simple ? 'Anzahl' : 'Anzahl Frühstück';
    document.getElementById('fAnzahl').placeholder = simple ? 'z. B. 12' : 'z. B. 2 oder 4 (Sein Sohn+1)';
  }

  function renderTable() {
    var simple = isSimple(active);
    var thead = document.getElementById('thead');
    thead.innerHTML = simple
      ? '<tr><th>Datum</th><th>Anzahl</th><th></th></tr>'
      : '<tr><th>Datum</th><th>Anzahl</th><th>Status</th><th>Mitarbeiter</th><th></th></tr>';

    var tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    var entries = (allData[active] || []).slice();
    if (simple) {
      entries.sort(function(a, b) { return b.datum.localeCompare(a.datum); }); // neueste zuerst
    }
    entries.forEach(function(e) {
      var tr = document.createElement('tr');
      if (simple) {
        tr.innerHTML = '<td>' + e.datum + '</td><td>' + e.anzahl + '</td><td></td>';
      } else {
        var statusClass = /bezahlt|paid/i.test(e.bemerkung) ? 'paid' : 'open';
        tr.innerHTML = '<td>' + e.datum + '</td><td>' + e.anzahl + '</td><td class="status ' + statusClass + '">' + e.bemerkung + '</td><td>' + (e.mitarbeiter || '') + '</td><td></td>';
      }
      var delTd = tr.lastElementChild;
      var editBtn = document.createElement('button');
      editBtn.className = 'del-btn';
      editBtn.innerHTML = '&#9998;';
      editBtn.title = 'Bearbeiten';
      editBtn.style.color = 'var(--olive-dark)';
      editBtn.onclick = function() { startEdit(e); };
      delTd.appendChild(editBtn);
      var delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.innerHTML = '&times;';
      delBtn.title = 'Löschen';
      delBtn.onclick = function() { deleteEntry(e.row); };
      delTd.appendChild(delBtn);
      tbody.appendChild(tr);
    });
  }

  function startEdit(e) {
    editingRow = e.row;
    document.getElementById('fDatum').value = e.datum;
    document.getElementById('fAnzahl').value = e.anzahl;
    if (!isSimple(active)) {
      document.getElementById('fStatus').value = /bezahlt|paid/i.test(e.bemerkung) ? 'paid' : 'open';
      document.getElementById('fMitarbeiter').value = e.mitarbeiter || 'Bestami';
    }
    document.getElementById('saveBtn').textContent = 'Änderungen speichern';
    document.getElementById('cancelBtn').style.display = 'block';
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function cancelEdit() {
    editingRow = null;
    document.getElementById('fDatum').value = '';
    document.getElementById('fAnzahl').value = '';
    document.getElementById('saveBtn').textContent = 'Speichern';
    document.getElementById('cancelBtn').style.display = 'none';
  }

  function saveEntry() {
    var simple = isSimple(active);
    var datum = document.getElementById('fDatum').value;
    var anzahl = document.getElementById('fAnzahl').value.trim();
    var status = simple ? '' : (document.getElementById('fStatus').value === 'paid' ? 'bezahlt' : 'offen');
    var mitarbeiter = simple ? '' : document.getElementById('fMitarbeiter').value;
    if (!datum || !anzahl) { toast('Bitte Datum und Anzahl ausfüllen.'); return; }

    if (editingRow !== null) {
      var code = askCode();
      if (code === null) return;
      var rowToEdit = editingRow;
      apiPost('updateEntry', { group: active, row: rowToEdit, datum: datum, anzahl: anzahl, bemerkung: status, mitarbeiter: mitarbeiter, code: code })
        .then(function(res) {
          if (!res.ok) { toast('Fehler: ' + res.error); return; }
          toast('Änderungen gespeichert.');
          cancelEdit();
          load();
        }).catch(function(err) { toast('Fehler: ' + err.message); });
      return;
    }

    apiPost('addEntry', { group: active, datum: datum, anzahl: anzahl, bemerkung: status, mitarbeiter: mitarbeiter })
      .then(function(res) {
        if (!res.ok) { toast('Fehler: ' + res.error); return; }
        toast('Gespeichert.');
        document.getElementById('fAnzahl').value = '';
        load();
      }).catch(function(err) { toast('Fehler: ' + err.message); });
  }

  function deleteEntry(row) {
    var code = askCode();
    if (code === null) return;
    apiPost('deleteEntry', { group: active, row: row, code: code }).then(function(res) {
      if (!res.ok) { toast('Fehler: ' + res.error); return; }
      toast('Eintrag gelöscht.');
      load();
    }).catch(function(err) { toast('Fehler: ' + err.message); });
  }

  function downloadAll() {
    var code = askCode();
    if (code === null) return;
    toast('PDF wird erstellt…');
    apiPost('exportPdf', { code: code }).then(function(res) {
      if (!res.ok) { toast('Fehler: ' + res.error); return; }
      var byteChars = atob(res.data);
      var byteNumbers = new Array(byteChars.length);
      for (var i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      var byteArray = new Uint8Array(byteNumbers);
      var blob = new Blob([byteArray], { type: 'application/pdf' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'fruehstueck-tracker.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }).catch(function(err) { toast('Fehler: ' + err.message); });
  }

  renderAdminArea();
  load();
  setInterval(function() { load(true); }, 12000);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function() {});
  }
</script>
</body>
</html>
